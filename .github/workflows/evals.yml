name: Model evals

# Runs the scripted intake conversations against the real model.
# Needs the ANTHROPIC_API_KEY repository secret; skips cleanly without it.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 13 * * 1" # weekly, to catch model behavior drift

jobs:
  evals:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: Check for API key
        id: key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY secret not set; skipping evals"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v6
        if: steps.key.outputs.present == 'true'
        with:
          python-version: "3.12"
      - if: steps.key.outputs.present == 'true'
        run: pip install -r backend/requirements.txt
      - name: Run evals
        if: steps.key.outputs.present == 'true'
        run: |
          python evals/run_evals.py --min-pass 0.85
          cat evals/results/latest.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && steps.key.outputs.present == 'true'
        with:
          name: eval-results
          path: evals/results/
