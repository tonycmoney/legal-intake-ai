name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: intake
          POSTGRES_PASSWORD: intake
          POSTGRES_DB: intake
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U intake"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check . ../evals
          ruff format --check . ../evals
      - name: Tests (SQLite)
        run: pytest --cov=app --cov-report=term-missing
      - name: Tests (Postgres)
        env:
          TEST_DATABASE_URL: postgresql://intake:intake@localhost:5432/intake
        run: pytest -q

  frontend:
    name: Frontend (lint + typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          set +e
          docker build --progress=plain -t legal-intake . > build.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            msg=$(tail -40 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=docker build failed::$msg"
          fi
          exit $status
      - name: Container serves the app and fails closed without secrets
        run: |
          docker run -d -p 8000:8000 --name app legal-intake
          ok=0
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && ok=1 && break; sleep 1; done
          docker logs app
          [ "$ok" = 1 ]
          curl -sf localhost:8000/ | grep -q "Client Intake"
          curl -sf localhost:8000/api/config | grep -q '"ai_enabled":false'
          token=$(curl -sf -X POST localhost:8000/api/intakes | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{"text":"hi"}' "localhost:8000/api/intakes/$token/messages")
          [ "$code" = 503 ]
          code=$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/api/staff/intakes)
          [ "$code" = 503 ]
